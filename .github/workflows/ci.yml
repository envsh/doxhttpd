---
name: CI

on:
  push:
    branches: [main, master, tryci]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Pull dependency repos
        run: bash scripts/pollup_deps.sh
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install backend dependencies
        run: |
          sudo apt update
          sudo apt install -y libtoxcore-dev libopus-dev \
            libsodium-dev libcurl4-openssl-dev
      - name: Pre-build custom commands
        run: ./scripts/ci_prebuild_go.sh
      - name: Build backend
        run: cd go-toxhttpd && ls -lh || true
      - name: Prepare backend artifact
        run: |
          mkdir -p bin
          cp go-toxhttpd/toxhttpd bin/toxhttpd
          chmod +x bin/toxhttpd
      - name: Upload backend binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-linux-backend
          path: bin/
          retention-days: 30

  build-backend-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Pull dependency repos
        run: bash scripts/pollup_deps.sh
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install toxcore dependencies
        run: |
          brew install toxcore opus libsodium openal-soft
      - name: Build backend
        run: |
          git clone -b group-ngc https://github.com/envsh/go-toxcore-c.git go-toxhttpd/go-toxcore-c
          cd go-toxhttpd && ln -sv go.work.impl go.work
          CGO_ENABLED=1 go build -o toxhttpd .
      - name: Prepare backend artifact
        run: |
          mkdir -p bin
          cp go-toxhttpd/toxhttpd bin/toxhttpd
          chmod +x bin/toxhttpd
      - name: Upload backend binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-macos-backend
          path: bin/
          retention-days: 30

  # Note: Ubuntu 18.04 is NOT supported as a container for GitHub Actions
  # because the runner's Node.js 20 requires GLIBC 2.28+, but Ubuntu 18.04
  # only has GLIBC 2.27.
  # Error: /__e/node20/bin/node: /lib/x86_64-linux-gnu/libc.so.6:
  # version `GLIBC_2.28' not found

  build-qltox-qt3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pull dependency repos
        run: bash scripts/pollup_deps.sh
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config \
            libcurl4-openssl-dev libfreetype-dev libopenal-dev \
            libx11-dev libxext-dev uuid-dev libxss-dev
      - name: Download and extract precompiled Qt3
        run: |
          sudo ln -sv /opt /opu
          curl -sL "https://github.com/qtchina/qt_build_scripts/releases/download/qt4.8/tde-qt338sh-linux-cjkinput-x64.tar.gz" \
            | sudo tar xzf - -C /opt
      - name: Install vcpkg and hjson-cpp
        run: |
          sudo mkdir -p /opt/vcpkg
          sudo chown "$(whoami)" /opt/vcpkg
          git clone --depth 1 https://github.com/Microsoft/vcpkg.git /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh
          /opt/vcpkg/vcpkg install hjson-cpp --triplet x64-linux-dynamic
      - name: Build qltox with Qt3
        run: |
          export PATH=/opt/qt338sh/bin:$PATH
          export QMAKESPEC=linux-g++
          cd qltox
          /opt/qt338sh/bin/qmake -makefile
          make -j$(nproc)
      - name: Prepare frontend artifact
        run: |
          mkdir -p bin
          cp qltox/qltox bin/qltox
          chmod +x bin/qltox
      - name: Upload qltox binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qltox-qt3-frontend
          path: bin/
          retention-days: 30

  build-qltox-qt5-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Pull dependency repos
        run: bash scripts/pollup_deps.sh
      - name: Install Qt5
        run: |
          brew install qt@5 freetype openal-soft pkg-config
          echo "/usr/local/opt/qt@5/bin" >> $GITHUB_PATH
      - name: Verify Qt5 installation
        run: |
          qmake -v
          which qmake
      - name: Install vcpkg and hjson-cpp
        run: |
          sudo mkdir -p /opt/vcpkg
          sudo chown "$(whoami)" /opt/vcpkg
          git clone --depth 1 https://github.com/Microsoft/vcpkg.git /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh
          /opt/vcpkg/vcpkg install hjson-cpp --triplet x64-osx-dynamic
      - name: Build qltox with Qt5
        run: |
          cd qltox
          export PKG_CONFIG_PATH=/usr/local/opt/openal-soft/lib/pkgconfig
          qmake qltox.pro CONFIG-=app_bundle
          make -j$(sysctl -n hw.logicalcpu)
      - name: Prepare artifact
        run: |
          mkdir -p bin
          cp qltox/qltox bin/qltox
          chmod +x bin/qltox
      - name: Upload qltox binary
        uses: actions/upload-artifact@v4
        with:
          name: qltox-qt5-macos-frontend
          path: bin/
          retention-days: 30

  package-release-linux:
    runs-on: ubuntu-22.04
    needs: [build-backend, build-qltox-qt3]
    steps:
      - uses: actions/checkout@v4
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-linux-backend
          path: release/
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: qltox-qt3-frontend
          path: release/
      - name: Organize files for packaging
        run: |
          mkdir -p release/bin release/web
          mv release/toxhttpd release/bin/
          mv release/qltox release/bin/
          cp -r web/* release/web/
          ls -lhR release/
      - name: Create tarball
        run: |
          cd release
          tar czvf ../toxhttpd-linux-x86_64-${{ github.ref_name }}.tar.gz bin/ web/
          cd ..
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-linux-release
          path: toxhttpd-linux-x86_64-*.tar.gz
          retention-days: 90

  package-release-macos:
    runs-on: ubuntu-22.04
    needs: [build-backend-mac, build-qltox-qt5-mac]
    steps:
      - uses: actions/checkout@v4
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-macos-backend
          path: release/
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: qltox-qt5-macos-frontend
          path: release/
      - name: Organize files for packaging
        run: |
          mkdir -p release/bin release/web
          mv release/toxhttpd release/bin/
          mv release/qltox release/bin/
          cp -r web/* release/web/
          ls -lhR release/
      - name: Create tarball
        run: |
          cd release
          tar czvf ../toxhttpd-macos-x86_64-${{ github.ref_name }}.tar.gz bin/ web/
          cd ..
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: toxhttpd-macos-release
          path: toxhttpd-macos-x86_64-*.tar.gz
          retention-days: 90

  upload-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    needs: [package-release-linux, package-release-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux release
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-linux-release
          path: release/
      - name: Download macOS native release
        uses: actions/download-artifact@v4
        with:
          name: toxhttpd-macos-release
          path: release/native/
      - name: Prepare files for upload
        run: |
          find release/ -name '*.tar.gz' -exec mv {} . \;
          ls -lh *.tar.gz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
            toxhttpd-*.tar.gz
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            toxhttpd-*.tar.gz --clobber

  build-qsktox-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Pull dependency repos
        run: bash scripts/pollup_deps.sh
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install aqtinstall
        run: pip install aqtinstall==3.3.0
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/.cache/aqtinstall
          key: qt-linux-6.7.3-gcc_64
      - name: Install Qt 6.7.3
        run: |
          aqt install-qt linux desktop 6.7.3 linux_gcc_64 \
            -m qtshadertools \
            --outputdir /opt/qt
          echo "=== Installed Qt directories ==="
          ls -la /opt/qt/6.7.3/
          HOST_DIR=$(find /opt/qt/6.7.3 -maxdepth 1 -type d \( -name 'linux*' -o -name 'gcc*' \) | head -1)
          echo "Detected host Qt dir: $HOST_DIR"
          echo "QTDIR=$HOST_DIR" >> $GITHUB_ENV
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libegl-dev libfontconfig-dev libxkbcommon-dev
          sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev
      - name: Cache QSkinny
        uses: actions/cache@v4
        id: cache-qskinny
        with:
          path: /opt/qt/qskinny
          key: qskinny-linux-${{ hashFiles('qsktox/plan.md') }}
      - name: Build and install QSkinny
        if: steps.cache-qskinny.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/uwerat/qskinny.git /tmp/qskinny
          cd /tmp/qskinny
          git checkout a46557b
          cmake -B build \
            -DCMAKE_PREFIX_PATH="$QTDIR" \
            -DQt6_DIR="$QTDIR/lib/cmake/Qt6" \
            -DCMAKE_INSTALL_PREFIX=/opt/qt/qskinny \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          cmake --install build
      - name: Build Go extras
        run: cd qsktox/extras/go && go build -buildmode=c-shared -o libgoso.so .
      - name: Configure
        run: |
          cd qsktox
          mkdir -p build-x64
          "$QTDIR/bin/qt-cmake" -S . -B build-x64 \
            -DQt6_DIR="$QTDIR/lib/cmake/Qt6" \
            -DCMAKE_PREFIX_PATH="$QTDIR;/opt/qt/qskinny" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=on
      - name: Hotfix link flags
        run: |
          sed -i 's/-lQt6Qml -lQt6Quick -lQt6OpenGL//g' \
            qsktox/build-x64/CMakeFiles/qsktox.dir/link.txt
      - name: Build
        run: cmake --build qsktox/build-x64 -j$(nproc)
      - name: Prepare artifact
        run: |
          mkdir -p bin
          cp qsktox/build-x64/qsktox bin/
          chmod +x bin/qsktox
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qsktox-linux-x64
          path: bin/
          retention-days: 30

  build-qsktox-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Pull dependency repos
        run: bash scripts/pollup_deps.sh
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'build-tools;34.0.0 platforms;android-34'
      - name: Align toolchain paths with local build-android.sh
        run: |
          # JDK 17.0.13+11 → /opt/jdk-17.0.13+11（与本地一致）
          cd /opt && sudo wget -q https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.13%2B11/OpenJDK17U-jdk_x64_linux_hotspot_17.0.13_11.tar.gz
          sudo tar xzf OpenJDK17U-jdk_x64_linux_hotspot_17.0.13_11.tar.gz && sudo rm OpenJDK17U-jdk_x64_linux_hotspot_17.0.13_11.tar.gz
          # NDK r26b → /opt/android-ndk-r26b
          sudo wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          sudo unzip -q android-ndk-r26b-linux.zip && sudo rm android-ndk-r26b-linux.zip
          # SDK 软链到本地同款路径
          sudo ln -sfn "$ANDROID_HOME" /opt/android-sdk
          # 补装 platforms;android-33（脚本 properties: androidCompileSdkVersion=android-33）
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" >/dev/null || true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install aqtinstall
        run: pip install aqtinstall==3.3.0
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/.cache/aqtinstall
          key: qt-android-6.7.3-arm64+gcc_64
      - name: Install Qt 6.7.3
        run: |
          aqt install-qt linux android 6.7.3 android_arm64_v8a --autodesktop \
            -m qtshadertools \
            --outputdir /opt/qt
          echo "=== Installed Qt directories ==="
          ls -la /opt/qt/6.7.3/
          HOST_DIR=$(find /opt/qt/6.7.3 -maxdepth 1 -type d \( -name 'linux*' -o -name 'gcc*' \) | head -1)
          echo "Detected host Qt dir: $HOST_DIR"
          echo "QT_ANDROID=/opt/qt/6.7.3/android_arm64_v8a" >> $GITHUB_ENV
          echo "QT_HOST=$HOST_DIR" >> $GITHUB_ENV
          # Qt host 目录对齐本地命名（build-android.sh 硬编码 gcc_64）
          ln -sfn "$HOST_DIR" /opt/qt/6.7.3/gcc_64
      - name: Install EGL dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev
      - name: Download vendor prebuilt libs (curl/openssl/sqlite for arm64)
        run: ./scripts/ci_prebuild_qsktox_vendor.sh
      - name: Cache QSkinny arm64
        uses: actions/cache@v4
        id: cache-qskinny-arm64
        with:
          path: /opt/qt/qskinny-arm64
          key: qskinny-android-arm64-v4-${{ hashFiles('qsktox/patches/qskinny-qt6.patch', '.github/workflows/ci.yml') }}
      - name: Build and install QSkinny arm64
        if: steps.cache-qskinny-arm64.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_ROOT: /opt/android-ndk-r26b
        run: |
          git clone https://github.com/uwerat/qskinny.git /tmp/qskinny-arm64
          cd /tmp/qskinny-arm64
          git checkout a46557b
          git apply "$GITHUB_WORKSPACE/qsktox/patches/qskinny-qt6.patch"
          "$QT_ANDROID/bin/qt-cmake" -S . -B build \
            -DCMAKE_INSTALL_PREFIX=/opt/qt/qskinny-arm64 \
            -DQT_HOST_PATH="$QT_HOST" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DBUILD_TOOLS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_PLAYGROUND=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          cmake --install build
      - name: Build Go extras (Android)
        env:
          ANDROID_NDK_ROOT: /opt/android-ndk-r26b
        run: |
          cd qsktox/extras/go
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            CC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            go build -buildmode=c-shared -o libgoso.so .
      - name: Build APK (build-android.sh)
        working-directory: qsktox
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: bash build-android.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qsktox-android-arm64-debug
          path: qsktox/build-android/android-build/build/outputs/apk/debug/*.apk
          retention-days: 30

  build-qsktox-osx:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Pull dependency repos
        run: bash scripts/pollup_deps.sh
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install aqtinstall
        run: pip install aqtinstall==3.3.0
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/aqtinstall
          key: qt-macos-6.7.3-clang_64
      - name: Install Qt 6.7.3
        run: |
          mkdir -p "$HOME/qt"
          aqt install-qt mac desktop 6.7.3 clang_64 \
            -m qtshadertools \
            --outputdir "$HOME/qt"
          echo "QTDIR=$HOME/qt/6.7.3/macos" >> $GITHUB_ENV
      - name: Cache QSkinny
        uses: actions/cache@v4
        id: cache-qskinny
        with:
          path: ~/qt/qskinny
          key: qskinny-macos-${{ hashFiles('qsktox/plan.md') }}
      - name: Build and install QSkinny
        if: steps.cache-qskinny.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/uwerat/qskinny.git /tmp/qskinny
          cd /tmp/qskinny
          git checkout a46557b
          cmake -B build \
            -DCMAKE_PREFIX_PATH="$QTDIR" \
            -DCMAKE_INSTALL_PREFIX="$HOME/qt/qskinny" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.logicalcpu)
          cmake --install build
      - name: Build Go extras
        run: cd qsktox/extras/go && go build -buildmode=c-shared -o libgoso.dylib .
      - name: Configure
        run: |
          cd qsktox
          mkdir -p build-osx
          "$QTDIR/bin/qt-cmake" -S . -B build-osx \
            -DQt6_DIR="$QTDIR/lib/cmake/Qt6" \
            -DCMAKE_PREFIX_PATH="$QTDIR;$HOME/qt/qskinny" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=on
      - name: Build
        run: cmake --build qsktox/build-osx -j$(sysctl -n hw.logicalcpu)
      - name: Prepare artifact
        run: |
          mkdir -p bin
          cp qsktox/build-osx/qsktox bin/
          chmod +x bin/qsktox
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qsktox-macos-arm64
          path: bin/
          retention-days: 30
